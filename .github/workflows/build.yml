name: Build Windows exe

on:
  push:
    branches: [main]
    paths: ["x_scraper.py", "requirements.txt", "VERSION", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --console --name XScraper --collect-all playwright --collect-data tzdata x_scraper.py
      - uses: actions/upload-artifact@v4
        with:
          name: XScraper-windows
          path: dist/XScraper.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: XScraper v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/XScraper.exe
          generate_release_notes: true
